# Static root site -> GitHub Pages. Publishes ./site only. ZERO secrets, no build, no providers.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard - riot.txt must be exactly the Riot-issued verification token (36 bytes, no newline)
        run: test "$(cat site/riot.txt)" = "7260521b-a94a-4d03-97a3-478570f51c0d" && test "$(wc -c < site/riot.txt)" -eq 36
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
